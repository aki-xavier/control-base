[package]
name = "control-base"
description = "The control stack's product-neutral base: the Plant contract, the shared contact model and the efference copy. Interfaces and value types, no engine and no model."
version = "0.1.0"
edition = "2021"
# The toolchain floor: the oldest compiler this crate is built and tested with.
rust-version = "1.87"
license = "MIT"

# The dependency set is exactly this, and the charter is what keeps it: `Mat`, `Vec3` and `Quat` are
# the only types the Plant contract's arithmetic is written in, and `pga`'s multivector is the type the
# contract HANDS ITS POSES OUT IN (`frame_motor`, `task_motor`) — one shared value type, in the crate
# that holds it and above no holder. `Efference` imports nothing at all.
#
# Why `pga` and not more: it is the zero-dependency crate of the shared value type, so naming it costs
# a boundary statement and no engine, no model and no arithmetic. Anything above it — a conversion that
# needs the model, a plant, an engine — is not a base's business.
[dependencies]
control-math = { path = "../control-math" }
pga = { path = "../pga" }

# A DEV-dependency only, and the charter above is unchanged by it: the comment rules, which this
# project's own test holds it to (tests/comment_why.rs). It reads text, has no dependencies of its own,
# and nothing in `src/` names it, so the base's `[dependencies]` set is still exactly the two below it.
[dev-dependencies]
comment-why = { path = "../comment-why" }

[lints.clippy]
# The one default lint this crate does not follow: `Efference::observe` fills parallel channel arrays
# by index, so the index is the channel number the two sides must agree on, not a slice's length.
needless_range_loop = "allow"
