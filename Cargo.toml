[package]
name = "control-base"
description = "The control stack's product-neutral base: the Plant contract a controller programs against, and the efference copy of what a layer commanded against what its sensor read. Interfaces and value types, no engine, no model, no layer."
version = "0.1.0"
edition = "2021"
# The toolchain floor: the oldest compiler this crate is built and tested with.
rust-version = "1.87"
license = "MIT"

# The dependency set is exactly this, and the charter is what keeps it: `Mat`, `Vec3` and `Quat` are
# the only types the Plant contract is written in, and Efference imports nothing at all.
[dependencies]
control-math = { path = "../control-math" }

[lints.clippy]
# The one default lint this crate does not follow: `Efference::observe` fills parallel channel arrays
# by index, so the index is the channel number the two sides must agree on, not a slice's length.
needless_range_loop = "allow"
